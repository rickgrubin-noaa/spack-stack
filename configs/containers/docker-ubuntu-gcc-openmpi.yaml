spack:
  concretizer:
    unify: true

  config:
    checksum: false
    build_jobs: 2
    connect_timeout: 60

  # Basic package config from configs/common/packages.yaml
  # Additional package config for container
  packages:
    all:
      prefer:
      - '%gcc'
      target: [core2]
      providers:
        mpi: [openmpi@5.0.8]
    gcc:
      buildable: false
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
    gcc-runtime:
      buildable: false
      externals:
      - spec: gcc-runtime@13.3.0
        prefix: /usr
    mpi:
      require: [openmpi@5.0.8]
    diffutils:
      buildable: false
      externals:
      - spec: diffutils@3.10
        prefix: /usr
    git:
      buildable: false
      externals:
      - spec: git@2.43.0~tcltk
        prefix: /usr
    git-lfs:
      buildable: false
      externals:
      - spec: git-lfs@3.4.1
        prefix: /usr
    llvm:
      buildable: false
      externals:
      - spec: llvm@14.0.6
        prefix: /usr
    mysql:
      buildable: false
      externals:
      - spec: mysql@8.0.40
        prefix: /usr
    qt:
      buildable: false
      externals:
      - spec: qt@5.15.3
        prefix: /usr
      version: [5.15.3]
    wget:
      buildable: false
      externals:
      - spec: wget@1.21.4
        prefix: /usr
    grep:
      buildable: false
      externals:
      - spec: grep@3.11
        prefix: /usr
    coreutils:
      buildable: false
      externals:
      - spec: coreutils@9.4
        prefix: /usr
    perl:
      buildable: false
      externals:
      - spec: perl@5.38.2
        prefix: /usr
    #m4:
    #  buildable: false
    #   externals:
    #  - spec: m4@1.4.19
    #     prefix: /usr
    findutils:
      buildable: false
      externals:
      - spec: findutils@4.9.0
        prefix: /usr
    sed:
      buildable: false
      externals:
      - spec: sed@4.9
        prefix: /usr
    gmake:
      buildable: false
      externals:
      - spec: gmake@4.3
        prefix: /usr
    automake:
      buildable: false
      externals:
      - spec: automake@1.16.5
        prefix: /usr
    binutils:
      buildable: false
      externals:
      - spec: binutils@2.42+gold~headers
        prefix: /usr
    autoconf:
      buildable: false
      externals:
      - spec: autoconf@2.71
        prefix: /usr
    gawk:
      buildable: false
      externals:
      - spec: gawk@5.2.1
        prefix: /usr
    gettext:
      buildable: false
      externals:
      - spec: gettext@0.21
        prefix: /usr
    groff:
      buildable: false
      externals:
      - spec: groff@1.23.0
        prefix: /usr
    libtool:
      buildable: false
      externals:
      - spec: libtool@2.4.7
        prefix: /usr
    pkgconf:
      buildable: false
      externals:
      - spec: pkgconf@1.8.1
        prefix: /usr
    tar:
      buildable: false
      externals:
      - spec: tar@1.35
        prefix: /usr
    jq:
      buildable: false
      externals:
      - spec: jq@1.7.1
        prefix: /usr

  specs: []

  container:

    # Select the format of the recipe e.g. docker,
    # singularity or anything else that is currently supported
    format: docker
    # How to use:
    #$ spack containerize > Dockerfile
    #$ sudo docker build -t myimage .
    #$ sudo docker run -it myimage

    #format: singularity
    # How to use:
    #$ spack containerize > singularity.def
    #$ sudo singularity build singularity.sif singularity.def

    # Sets the base images for the stages where Spack builds the
    # software or where the software gets installed after being built..
    images:
      os: ubuntu:24.04
      spack:
        url: https://github.com/jcsda/spack-stack
        ref: origin/release/2.0
        resolve_sha: true

    # Whether or not to strip binaries
    strip: false

    ## Additional system packages that are needed at runtime
    os_packages:
      build:
      - bc
      - cpp-13
      - g++-13
      - gcc-13
      - gfortran-13
      - git
      - git-lfs
      - llvm-14
      - make
      - mysql-server
      - qtbase5-dev
      - qt5-qmake
      - libqt5svg5-dev
      - qt5dxcb-plugin
      - wget
      - diffutils
      - libgomp1
      - autopoint
      - jq
      - file
      - curl
      - iproute2
      - tcl-dev
      - unzip
      - bzip2
      - gettext
      - libtree
      - pkg-config
      - libcurl4-openssl-dev
      - perl
      - autoconf
      - libtool

      final:
      - bc
      - cpp-13
      - g++-13
      - gcc-13
      - gfortran-13
      - git
      - git-lfs
      - llvm-14
      - make
      - mysql-server
      - qtbase5-dev
      - qt5-qmake
      - libqt5svg5-dev
      - qt5dxcb-plugin
      - wget
      - ca-certificates
      - curl
      - file
      - gnupg2
      - iproute2
      - locales
      - unzip
      - vim
      - nano
      - less
      - jq
      - tcl-dev
      - bzip2
      - gettext
      - libtree
      - pkg-config
      - libcurl4-openssl-dev
      - perl
      - autoconf
      - libtool

    # Extra instructions
    extra_instructions:
      pre_build: |
        RUN update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-14 100 \
            && spack clean --all \
            && spack gc -y
      pre_final: |
        # Set environment variables for installing tzdata
        ENV DEBIAN_FRONTEND=noninteractive
        ENV TZ=Etc/UTC
        ENV CC=gcc
        ENV CXX=g++
        ENV FC=gfortran
      build: |
        # Put output of spack find into a file
        RUN cd /opt/spack-environment && \
        spack env activate -d . && \
        spack find 2>&1 | tee /root/spack_find.out
      final: |
        # Copy spack find output from builder
        COPY --from=builder /root/spack_find.out /root/spack_find.out
        # Set defaults for compilers and build utilities.
        RUN update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-14 100 && \
        update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100 && \
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 && \
        update-alternatives --install /usr/bin/gfortran gfortran /usr/bin/gfortran-13 100 && \
        # Make a non-root user:nonroot / group:nonroot for running MPI
        RUN useradd -U -k /etc/skel -s /bin/bash -d /home/nonroot -m nonroot --uid 43891 && \
        echo "ulimit -s unlimited" >> /home/nonroot/.bashrc && \
        echo "ulimit -v unlimited" >> /home/nonroot/.bashrc && \
        echo "export CC=gcc" >> /home/nonroot/.bashrc && \
        echo "export CXX=g++" >> /home/nonroot/.bashrc && \
        echo "export FC=gfortran" >> /home/nonroot/.bashrc && \
        printf "[credential]\n    helper = cache --timeout=7200\n" >> /home/nonroot/.gitconfig && \
        mkdir /home/nonroot/.pmix && \
        echo "rmaps_default_mapping_policy=:oversubscribe" >> /home/nonroot/.pmix/mca-params.conf && \
        chown -R nonroot:nonroot /home/nonroot/.gitconfig /home/nonroot/.pmix
        # Replicate settings for root user
        RUN echo "ulimit -s unlimited" >> /root/.bashrc && \
        echo "ulimit -v unlimited" >> /root/.bashrc && \
        echo "export CC=gcc" >> /root/.bashrc && \
        echo "export CXX=g++" >> /root/.bashrc && \
        echo "export FC=gfortran" >> /root/.bashrc && \
        printf "[credential]\n    helper = cache --timeout=7200\n" >> /root/.gitconfig && \
        mkdir /root/.pmix && \
        echo "rmaps_default_mapping_policy=:oversubscribe" >> /root/.pmix/mca-params.conf
        # Also set necessary environment variables for openmpi and jedi-cmake.
        RUN echo "export OMPI_ALLOW_RUN_AS_ROOT=1" >> /root/.bashrc && \
        echo "export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1" >> /root/.bashrc && \
        echo "export PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe" >> /root/.bashrc && \
        echo "export jedi_cmake_ROOT=$(ls -d /opt/software/linux-ubuntu*/gcc-*/jedi-cmake-*)" >> /root/.bashrc

    # Labels for the image
    labels:
      app: ""
      mpi: "openmpi"
